name: Java compile and smoke tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: mkdir -p build && javac -encoding UTF-8 -d build src/AddressBook.java
      - name: Exercise CLI
        run: python -m unittest discover -s tests -v
