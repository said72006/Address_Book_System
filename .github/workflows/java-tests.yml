name: Java compile and smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: mkdir -p build && javac -encoding UTF-8 -d build src/AddressBook.java
      - name: Exercise CLI
        run: python -m unittest discover -s tests -v
